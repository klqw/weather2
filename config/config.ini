[PATH]
data_dir=data
input_dir=input
output_dir=output
config_dir=config
result_dir=output/result
card_dir=output/card

[FILE]
messages=message_config.json
items=item_config.json
prec_no=prec_no.csv
amdmaster=amdmaster.index4

[COLUMN]
observed_date=年月日
avg_temp=平均気温(℃)
max_temp=最高気温(℃)
min_temp=最低気温(℃)
avg_humidity=平均湿度(％)
sunshine_hours=日照時間(時間)
avg_wind_speed=平均風速(m/s)
precipitation=降水量の合計(mm)
max_snow_depth=最深積雪(cm)

[SCORE_LABEL]
location_daily_score=指定地点・指定日
location_month_score=指定地点・指定月
location_overall_score=指定地点・全期間
all_daily_score=全地点・指定日
all_month_score=全地点・指定月
all_overall_score=全地点・全期間
output_location_score=地点スコア
output_all_score=全体スコア

[LOG]
log_file=log/app.log
log_encoding=utf-8

[URL]
jma_url=https://www.data.jma.go.jp/stats/etrn/select/prefecture.php
amdmaster_url=https://www.data.jma.go.jp/stats/data/mdrr/chiten/meta/amdmaster.index4
dl_url=https://www.data.jma.go.jp/risk/obsdl/show/table

[DOWNLOAD]
chunk_years=15
download_interval=30
request_timeout=300
request_interval=3

[CSV]
input_encoding=shift_jis
output_encoding=utf-8-sig

[DATABASE]
secret_file=config/db_secret.ini